name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix Index HTML Path and Build
        run: |
          # Find project root where index.html is located
          PROJECT_DIR=$(dirname $(find . -name "index.html" -not -path "*/node_modules/*"))
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Automatically fix the main.tsx path in index.html if it has leading slash/dot
          sed -i 's|src="/src/|src="./src/|g' index.html
          sed -i 's|src="/main.tsx"|src="./src/main.tsx"|g' index.html
          
          # Install dependencies and build
          rm -f package-lock.json bun.lock
          npm install --force
          npm run build
          npx cap sync android

      - name: Fix Gradle Wrapper & Build APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "index.html" -not -path "*/node_modules/*"))
          cd "$PROJECT_DIR/android"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
